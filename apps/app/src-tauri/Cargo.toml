[package]
name = "app"
version = "0.9.92-beta"
description = "Nota"
authors = ["Tsuzat"]
license = "MIT"
repository = "https://github.com/Tsuzat/Nota"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"
tauri-plugin-http = "2"
tauri-plugin-stronghold = "2"
rand = "0.9.5"
sha2 = "0.10.9"
td = "0.1.0"
zstd = "0.13.3"
tauri-plugin-fs = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false

# Proc-macros / build scripts get normal, safe settings — NOT the aggressive ones above.
[profile.release.build-override]
codegen-units = 16
opt-level = 3
strip = false      # Prevents macOS strip from corrupting proc-macro dylibs (mis-aligned LINKEDIT string pool)

[profile.dev.package.scrypt]
opt-level = 3
