[package]
name = "app"
version = "0.1.0"
description = "Nota"
authors = ["Tsuzat"]
license = "MIT"
repository = "https://github.com/Tsuzat/Nota"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
incremental = false

# Proc-macros / build scripts get normal, safe settings — NOT the aggressive ones above.
# Explicit strip/lto overrides required for macOS 15+/27 beta linker compatibility.
[profile.release.build-override]
opt-level = 0
codegen-units = 16
debug = false
strip = false

# Belt-and-suspenders: ensure sqlx-macros proc-macro dylib isn't stripped
# (macOS 27 beta linker produces mis-aligned LINKEDIT with strip+opt-level=z)
[profile.release.package.sqlx-macros]
strip = false
opt-level = 0
